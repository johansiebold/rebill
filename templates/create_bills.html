<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Konfiguration</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/water.css@2/out/water.css">
    <style>
        body { max-width: none; }
    </style>
</head>
<body>
    <main class="container-fluid">
        <nav>
            <a href="/create-bills">Rechnung erstellen</a> | <a href="/configuration">Konfiguration</a>
        </nav>
        <h1>Konfiguration</h1>

        <div style="display: flex; gap: 2rem;">
            <nav style="min-width: 200px;">
                <h2>Windparks</h2>
                <ul style="list-style: none; padding-left: 0;">
                {% for p in parks %}
                    <li>
                        <a href="/create-bills?park={{ p | urlencode }}"{% if p == selected_park %} style="font-weight: bold;"{% endif %}>
                            {{ p }}
                        </a>
                    </li>
                {% endfor %}
                </ul>
            </nav>
            <div style="flex: 1;">
                <form method="post" action="/create-bills/{{ selected_park | urlencode }}/create_bill">
                    <label for="monthly_market_value">Monatsmarktwert [ct/kWh]:</label>
                    <select name="invoice_month" id="invoice_month">
                        {% for m, mw in monthly_market_values.items() %}
                            <option value="{{ m }}">{{ m }} - {{ mw }} ct/kWh</option>
                        {% endfor %}
                    </select>

                    <h2>Vergütungsfähige Energiemengen</h2>
                    {% for turbine_id, info in turbines.items() %}
                        <article>
                            <h3>{{ turbine_id }} – {{ info.park }}</h3>
                            <label for="production_{{ turbine_id }}">Monatliche Produktion (kWh):</label>
                            <input type="number" name="production_{{ turbine_id }}" id="production_{{ turbine_id }}" step="0.01" required>
                        </article>
                    {% endfor %}

                    <button type="submit">Abrechnung erstellen</button>
                </form>
            </div>
        </div>
    </main>
</body>
</html>
